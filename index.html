<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f3">
  <meta name="description" content="Interactive mind map directory">
  <title>Mindmap</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23181818'/%3E%3Ccircle cx='19' cy='32' r='6' fill='white'/%3E%3Ccircle cx='45' cy='18' r='5' fill='white'/%3E%3Ccircle cx='45' cy='46' r='5' fill='white'/%3E%3Cpath d='M25 29l15-8M25 35l15 8' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{
      --bg:#f7f7f4;
      --surface:#fff;
      --surface-soft:#f0f0ec;
      --text:#181818;
      --muted:#777771;
      --line:#deded8;
      --shadow:0 12px 32px rgba(0,0,0,.055);
    }
    *{box-sizing:border-box}
    html{color-scheme:light}
    body{
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button,input{font:inherit}
    a{color:inherit}
    button:focus-visible,a:focus-visible,input:focus-visible{
      outline:3px solid rgba(24,24,24,.14);
      outline-offset:3px;
    }
    .page{
      width:min(1180px,calc(100% - 40px));
      margin:0 auto;
      padding:34px 0 70px;
    }
    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-bottom:28px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:11px;
      font-size:17px;
      font-weight:700;
      letter-spacing:-.025em;
    }
    .brand-mark{
      width:34px;
      height:34px;
      border-radius:10px;
      background:#181818;
      color:#fff;
      display:grid;
      place-items:center;
    }
    .brand-mark svg{width:20px;height:20px}
    .count{
      color:var(--muted);
      font-size:13px;
    }
    .search-wrap{
      position:relative;
      width:100%;
      margin-bottom:20px;
    }
    .search-wrap svg{
      position:absolute;
      width:20px;
      height:20px;
      left:18px;
      top:50%;
      transform:translateY(-50%);
      color:#85857f;
      pointer-events:none;
    }
    .search{
      width:100%;
      height:58px;
      border:1px solid var(--line);
      border-radius:17px;
      background:var(--surface);
      color:var(--text);
      padding:0 20px 0 51px;
      font-size:16px;
      box-shadow:0 3px 15px rgba(0,0,0,.025);
    }
    .search::placeholder{color:#989892}
    .filters{
      display:none;
      gap:8px;
      overflow-x:auto;
      padding:0 0 18px;
      scrollbar-width:none;
    }
    .filters::-webkit-scrollbar{display:none}
    .filter{
      flex:0 0 auto;
      border:1px solid var(--line);
      background:var(--surface);
      color:var(--muted);
      padding:8px 12px;
      border-radius:999px;
      font-size:12px;
      cursor:pointer;
    }
    .filter.active{
      background:var(--text);
      border-color:var(--text);
      color:#fff;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:14px;
    }
    .card{
      min-width:0;
      min-height:190px;
      display:flex;
      flex-direction:column;
      padding:19px;
      border:1px solid var(--line);
      border-radius:18px;
      background:var(--surface);
      color:inherit;
      text-decoration:none;
      transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
    }
    .card:hover{
      transform:translateY(-2px);
      border-color:#c7c7c0;
      box-shadow:var(--shadow);
    }
    .card-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }
    .icon{
      width:42px;
      height:42px;
      border-radius:12px;
      display:grid;
      place-items:center;
      background:var(--surface-soft);
      font-size:18px;
    }
    .fav{
      width:38px;
      height:38px;
      display:grid;
      place-items:center;
      border:0;
      border-radius:10px;
      background:transparent;
      color:#aaa9a3;
      cursor:pointer;
    }
    .fav:hover{background:var(--surface-soft);color:var(--text)}
    .fav.active{color:var(--text)}
    .fav svg{width:18px;height:18px}
    .card-copy{
      margin-top:auto;
      padding-top:28px;
    }
    .card h2{
      margin:0;
      font-size:18px;
      line-height:1.25;
      letter-spacing:-.025em;
    }
    .card p{
      margin:7px 0 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }
    .meta{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-top:15px;
      color:#969690;
      font-size:11px;
    }
    .empty{
      grid-column:1/-1;
      padding:70px 20px;
      text-align:center;
      color:var(--muted);
      font-size:14px;
    }
    .empty strong{
      display:block;
      margin-bottom:6px;
      color:var(--text);
      font-size:15px;
    }
    .no-results{
      grid-column:1/-1;
      display:none;
      padding:60px 20px;
      text-align:center;
      color:var(--muted);
      font-size:14px;
    }
    @media(max-width:900px){
      .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(max-width:620px){
      .page{
        width:min(100% - 28px,1180px);
        padding-top:22px;
      }
      .top{margin-bottom:20px}
      .count{display:none}
      .search{height:54px;border-radius:15px}
      .grid{grid-template-columns:1fr}
      .card{min-height:175px}
    }
    @media(prefers-reduced-motion:reduce){
      *{transition:none!important}
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="6" cy="12" r="2.5" fill="currentColor"/>
            <circle cx="18" cy="6" r="2.2" fill="currentColor"/>
            <circle cx="18" cy="18" r="2.2" fill="currentColor"/>
            <path d="M8.3 10.9 15.8 7M8.3 13.1l7.5 3.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </span>
        <span>Mindmap</span>
      </div>
      <span class="count" id="count"></span>
    </header>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="6.6" stroke="currentColor" stroke-width="1.7"/>
        <path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <input id="search" class="search" type="search" placeholder="Search mind maps..." autocomplete="off" aria-label="Search mind maps">
    </div>

    <div id="filters" class="filters" aria-label="Mind map categories"></div>
    <section id="grid" class="grid" aria-label="Mind map directory"></section>
    <div id="noResults" class="no-results">No mind maps found.</div>
  </main>

  <script>
    /*
      Add every future mind map here.
      The directory updates automatically.

      Example:
      {
        id: "wordpress-development",
        title: "WordPress Development",
        description: "Architecture, frontend, backend, SEO and hosting.",
        category: "Development",
        file: "wordpress-development.html",
        icon: "W",
        updated: "2026-10-04"
      }
    */
    const MINDMAPS = [
      {
        id: "wordpress-development",
        title: "WordPress Development",
        description: "Explore planning, frontend, core, themes, plugins, APIs, security, performance, SEO, hosting, testing and maintenance.",
        category: "Development",
        tags: ["WordPress","PHP","Elementor","Gutenberg","Themes","Plugins","REST API","Security","Performance","SEO"],
        file: "wordpress-development.html",
        icon: "W",
        updated: "2026-10-04"
      }
    ];

    const search = document.getElementById("search");
    const grid = document.getElementById("grid");
    const filters = document.getElementById("filters");
    const count = document.getElementById("count");
    const noResults = document.getElementById("noResults");

    const state = {
      query: "",
      category: "All",
      favorites: new Set(readJSON("mindmap:favorites", []))
    };

    function readJSON(key, fallback) {
      try {
        const value = JSON.parse(localStorage.getItem(key));
        return value ?? fallback;
      } catch {
        return fallback;
      }
    }

    function writeJSON(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[char]));
    }

    function categories() {
      return ["All", ...new Set(MINDMAPS.map(map => map.category).filter(Boolean))];
    }

    function getMaps() {
      const q = state.query.trim().toLowerCase();

      return MINDMAPS.filter(map => {
        const categoryMatch = state.category === "All" || map.category === state.category;
        const haystack = [
          map.title,
          map.description,
          map.category,
          ...(map.tags || [])
        ].join(" ").toLowerCase();

        return categoryMatch && (!q || haystack.includes(q));
      });
    }

    function star(active) {
      return `
        <svg viewBox="0 0 24 24" fill="${active ? "currentColor" : "none"}" aria-hidden="true">
          <path d="m12 3 2.75 5.57 6.15.9-4.45 4.33 1.05 6.12L12 17.03l-5.5 2.89 1.05-6.12L3.1 9.47l6.15-.9L12 3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
      `;
    }

    function renderFilters() {
      const items = categories();
      filters.style.display = items.length > 2 ? "flex" : "none";

      filters.innerHTML = items.map(category => `
        <button type="button" class="filter ${category === state.category ? "active" : ""}" data-category="${escapeHTML(category)}">
          ${escapeHTML(category)}
        </button>
      `).join("");

      filters.querySelectorAll("[data-category]").forEach(button => {
        button.addEventListener("click", () => {
          state.category = button.dataset.category;
          render();
        });
      });
    }

    function renderCards() {
      const maps = getMaps();

      if (!MINDMAPS.length) {
        grid.innerHTML = `
          <div class="empty">
            <strong>No mind maps yet.</strong>
            The first map we create will appear here.
          </div>
        `;
        noResults.style.display = "none";
        return;
      }

      grid.innerHTML = maps.map(map => {
        const favorite = state.favorites.has(map.id);

        return `
          <a class="card" href="${escapeHTML(map.file)}">
            <div class="card-top">
              <div class="icon" aria-hidden="true">${escapeHTML(map.icon || "◌")}</div>
              <button
                class="fav ${favorite ? "active" : ""}"
                type="button"
                data-favorite="${escapeHTML(map.id)}"
                aria-label="${favorite ? "Remove from favorites" : "Add to favorites"}"
              >
                ${star(favorite)}
              </button>
            </div>

            <div class="card-copy">
              <h2>${escapeHTML(map.title)}</h2>
              <p>${escapeHTML(map.description || "")}</p>
              <div class="meta">
                <span>${escapeHTML(map.category || "General")}</span>
                <span>${escapeHTML(map.updated || "")}</span>
              </div>
            </div>
          </a>
        `;
      }).join("");

      noResults.style.display = maps.length ? "none" : "block";

      grid.querySelectorAll("[data-favorite]").forEach(button => {
        button.addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();

          const id = button.dataset.favorite;

          if (state.favorites.has(id)) {
            state.favorites.delete(id);
          } else {
            state.favorites.add(id);
          }

          writeJSON("mindmap:favorites", [...state.favorites]);
          renderCards();
        });
      });
    }

    function render() {
      count.textContent = MINDMAPS.length
        ? MINDMAPS.length + (MINDMAPS.length === 1 ? " mind map" : " mind maps")
        : "";

      renderFilters();
      renderCards();
    }

    search.addEventListener("input", () => {
      state.query = search.value;
      renderCards();
    });

    document.addEventListener("keydown", event => {
      const typing = /input|textarea|select/i.test(document.activeElement.tagName);

      if (event.key === "/" && !typing) {
        event.preventDefault();
        search.focus();
      }

      if (event.key === "Escape" && document.activeElement === search) {
        search.value = "";
        state.query = "";
        search.blur();
        renderCards();
      }
    });

    render();
  </script>
</body>
</html>
